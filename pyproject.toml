[project]
name = "lineagelens"
version = "0.1.0"
description = "Column-level lineage that answers 'which three dashboards break', not 'forty-seven objects touch this table'."
requires-python = ">=3.11"
dependencies = []

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
